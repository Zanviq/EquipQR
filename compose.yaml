services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: equipqr
      POSTGRES_USER: equipqr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipqr -d equipqr"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - equipqr-db-v18:/var/lib/postgresql
  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  equipqr-db-v18:
