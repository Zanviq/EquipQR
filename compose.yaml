services:
  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: equipqr
      POSTGRES_USER: equipqr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U equipqr -d equipqr"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - equipqr-db-v18:/var/lib/postgresql

  # 마이그레이션 적용 후 SEED_DEMO=true이면 데모 계정(demo / demo1234)과 장비를 넣는다. 반복 실행해도 안전하다.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://equipqr:${POSTGRES_PASSWORD}@db:5432/equipqr
      SEED_DEMO: ${SEED_DEMO:-true}
    command: ["sh", "-c", "npx prisma migrate deploy && if [ \"$$SEED_DEMO\" = \"true\" ]; then npx tsx scripts/seed-demo.ts; fi"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://equipqr:${POSTGRES_PASSWORD}@db:5432/equipqr
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      SESSION_COOKIE_SECURE: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  equipqr-db-v18:
